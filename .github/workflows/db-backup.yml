name: Database backup

# Off-host replacement for scripts/backup/run-backup.sh's previous trigger
# (launchd on a single personal Mac, which meant backups silently stopped
# whenever that laptop was off). Runs on GitHub's own infrastructure
# instead — same flow, same script, same destination service, just fired
# reliably regardless of anyone's hardware.
#
# Flow, identical in spirit to the old script: SSH to Render -> take an
# online backup with better-sqlite3 into /tmp on the remote (never the
# persistent disk itself) -> download it here -> delete the remote temp
# copy -> verify integrity -> keep it as a workflow artifact for 14 days
# (matching the old script's RETENTION_DAYS), which GitHub prunes
# automatically — no manual `find -mtime +N -delete` step needed.
#
# On failure: GitHub itself emails whoever last edited this workflow file
# whenever a scheduled run fails — a real inbox, not a desktop notification
# on one specific machine that has to be awake to see it.

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily (~04:00/05:00 Africa/Cairo, off-hours)
  workflow_dispatch: {}    # lets anyone with write access trigger a run on demand

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SSH_HOST: srv-d9s69vfavr4c73ai7vi0@ssh.oregon.render.com
      REMOTE_APP_DIR: /opt/render/project/src/server
    steps:
      - name: Configure SSH
        # RENDER_BACKUP_SSH_KEY holds the private key base64-encoded as one
        # line, not the raw multi-line PEM/OpenSSH block — a raw multi-line
        # secret is prone to silent newline mangling when pasted into
        # GitHub's secret text box (this is what caused the first run's
        # "error in libcrypto" / "Permission denied (publickey)" failure).
        # Base64 has no embedded newlines to lose, so there's nothing for
        # copy-paste to corrupt.
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.RENDER_BACKUP_SSH_KEY }}" | base64 -d > ~/.ssh/render_backup_ci
          chmod 600 ~/.ssh/render_backup_ci
          ssh-keygen -y -f ~/.ssh/render_backup_ci > /dev/null || (echo "::error::Decoded private key is invalid — check that RENDER_BACKUP_SSH_KEY holds the exact base64 output of the key file, with no extra whitespace." && exit 1)
          ssh-keyscan -H ssh.oregon.render.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Take remote snapshot
        run: |
          TIMESTAMP="$(date +%Y%m%d-%H%M%S)"
          echo "TIMESTAMP=$TIMESTAMP" >> "$GITHUB_ENV"
          echo "REMOTE_TMP=/tmp/pp-backup-$TIMESTAMP.db" >> "$GITHUB_ENV"

      - name: Snapshot on Render
        run: |
          ssh -i ~/.ssh/render_backup_ci -o BatchMode=yes "$SSH_HOST" \
            "cd '$REMOTE_APP_DIR' && DB_DIR=/var/data node src/backup.js '$REMOTE_TMP'"

      - name: Download snapshot
        run: |
          scp -i ~/.ssh/render_backup_ci -o BatchMode=yes \
            "$SSH_HOST:$REMOTE_TMP" "backup-$TIMESTAMP.db"

      - name: Delete remote temp copy
        if: always()
        run: |
          ssh -i ~/.ssh/render_backup_ci -o BatchMode=yes "$SSH_HOST" \
            "rm -f '$REMOTE_TMP'" || echo "::warning::Could not delete remote temp file $REMOTE_TMP"

      - name: Verify integrity
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3
          RESULT="$(sqlite3 "backup-$TIMESTAMP.db" "PRAGMA integrity_check;")"
          if [ "$RESULT" != "ok" ]; then
            echo "::error::Integrity check failed on backup-$TIMESTAMP.db: $RESULT"
            exit 1
          fi
          echo "Integrity check passed. Size: $(stat -c%s "backup-$TIMESTAMP.db") bytes"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.TIMESTAMP }}
          path: backup-${{ env.TIMESTAMP }}.db
          retention-days: 14
          if-no-files-found: error
