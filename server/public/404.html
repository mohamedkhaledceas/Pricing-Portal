<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — CEAS Portal</title>
<style>
  :root{
    color-scheme: light;
    --surface-1:#ffffff; --plane:#e5e5e5; --ink:#191919; --ink-2:#4a4a4a;
    --muted:#8a8a8a; --border:rgba(25,25,25,0.12); --on-accent:#ffffff;
    --accent:#042940; --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --surface-1:#191919; --plane:#0d0d0d; --ink:#ffffff; --ink-2:#cfcfcf;
      --muted:#8a8a8a; --border:rgba(255,255,255,0.12); --on-accent:#191919;
      --accent:#a2c8ff;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--plane); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:14px; line-height:1.5;
    padding:24px;
  }
  .card{
    background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius);
    padding:36px 32px; max-width:380px; width:100%; text-align:center;
  }
  img{height:36px; width:auto; margin-bottom:20px}
  .code{font-size:12px; font-weight:700; letter-spacing:0.08em; color:var(--muted); text-transform:uppercase}
  h1{font-size:19px; margin:8px 0 6px}
  p{color:var(--ink-2); margin:0 0 22px}
  a.btn{
    display:inline-block; font:inherit; font-size:13px; font-weight:600; text-decoration:none;
    padding:9px 18px; border-radius:8px; background:var(--accent); color:var(--on-accent);
  }
  a.btn:hover{filter:brightness(0.93)}
</style>
</head>
<body>
  <div class="card">
    <picture>
      <source srcset="/logo-dark.png" media="(prefers-color-scheme: dark)">
      <img src="/logo-light.png" alt="CEAS">
    </picture>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or may have moved.</p>
    <a class="btn" href="/">Go to Home</a>
  </div>
</body>
</html>
